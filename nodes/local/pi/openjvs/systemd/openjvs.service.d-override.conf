# OpenJVS ships a unit with ExecStart=/usr/bin/openjvs, but its own `make install`
# puts the binary in /usr/local/bin. Without this the unit dies with 203/EXEC.
# A drop-in rather than an edit, so reinstalling OpenJVS cannot undo the fix.
[Service]
ExecStart=
ExecStart=/usr/local/bin/openjvs

# RS485 driver-enable over RTS (see writeBytes in hardware/device.c).
# unset = leave RTS alone (upstream behaviour) | 1 = assert while transmitting | 0 = inverse.

# OpenJVS fails to export the sense GPIO itself (its own export write does not take),
# so do it here first. 595 = Pi 5 RP1 base 569 + BCM 26. "|| true" because the export
# fails harmlessly when the pin is already exported from a previous start.
# Not GPIO12 (pin 32), the old sense pin: it took the NAOMI's 5 V while the 1k pull-down was
# broken and can no longer sink current (still reads inputs and drives high). Keep it off
# anything that pulls low: sense lines, open-drain buses, LEDs wired to 3.3 V.
ExecStartPre=/bin/sh -c "echo 595 > /sys/class/gpio/export || true"
