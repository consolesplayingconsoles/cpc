<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- FALLBACK ONLY, for a browser that can't hold an MJPEG stream: reload the whole
     page on a timer. Everything else just watches the stream below and never reloads.
     "Strip rather than break", CLAUDE.md 7.2. -->
<noscript><meta http-equiv="refresh" content="<!--CPC_REFRESH-->"></noscript>
<title><!--CPC_TITLE--></title>
<style>
  /* The picture IS the page: no margins, no chrome, nothing competing for panel
     space (add ?chrome=1 to get the header/status back). */
  html,body{margin:0;padding:0;height:100%;background:#fff;color:#1a1a1a;
    font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;text-align:center}
  /* Send a small, near-native frame and let the PANEL scale it up -- but nearest
     neighbour, not smoothed: the source is console pixel art, so crisp blocks beat
     a blurred interpolation, and it means we can ship a third of the bytes. Browsers
     without the property just smooth it, which is what they did before anyway. */
  /* Fit the VISIBLE area, not just the width: the Kindle browser's own address/nav
     bars eat vertical space, and width:100% alone pushed the bottom of the picture
     off-screen. Capping both axes and leaving width/height auto letterboxes it to
     whatever is actually left -- no object-fit needed, so old engines behave too. */
  #f{display:block;margin:0 auto;max-width:100%;max-height:100vh;width:auto;height:auto;
     image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;image-rendering:pixelated}
  #hd{font-size:12px;font-weight:bold;letter-spacing:1px;padding:4px 0;border-bottom:1px solid #c8c8c4}
  #status{font-size:11px;color:#888884;padding:4px 0}
</style>
</head>
<body>
<!--CPC_HEAD-->
<img id="f" src="<!--CPC_SRC-->" alt="">
<!--CPC_FOOT-->
<script>
/* The ONLY job left for script here: if the stream dies (Kindle wifi slept, host
   restarted), reconnect it. Without this the <img> would sit on its last frame
   forever. ES3-safe -- no fetch, no arrow functions, no template strings. */
(function () {
  var img = document.getElementById('f');
  if (!img) { return; }
  var base = img.getAttribute('src');
  function reconnect() {
    /* new query each time so nothing is served from cache */
    img.src = base + (base.indexOf('?') === -1 ? '?' : '&') + 'k=' + (new Date()).getTime();
  }
  img.onerror = function () { setTimeout(reconnect, 2000); };
})();
</script>
</body>
</html>
