openapi: 3.0.3
info:
  title: Pluto API
  version: 0.1.0
  description: >
    The Pluto dashboard's HTTP API (stdlib http.server) -- the control plane for
    the CPC network: node roster + topology, chat, the Control/Guide-Dog drive
    pipeline, the Vision (Lens) feed, the Dreamcast translation workbench, and the
    per-node deploy engine. Terse on purpose: this documents the route SURFACE
    (kept honest by scripts/check_openapi_drift.py vs API_ROUTES in api.py);
    request/response schemas are intentionally light.
servers:
  # Relative: "Try it out" targets the same origin you loaded /docs from (the Lab
  # in dev, the C2 in prod) -- no host variable to type, right host automatically.
  - url: /
    description: This Pluto (same origin as the docs page)
tags:
  - { name: chat }
  - { name: nodes }
  - { name: deploy }
  - { name: mappings }
  - { name: control }
  - { name: google }
  - { name: translate }
  - { name: catalogue }
  - { name: docs }
paths:
  /retro:
    get: { tags: [chat], summary: Barebones retro-console chat page (HTML), responses: { '200': { description: HTML } } }
  /kindle:
    get: { tags: [control], summary: Zero-JS retro capture-frame viewer for e-ink browsers (HTML), responses: { '200': { description: HTML } } }
  /dreame:
    get: { tags: [nodes], summary: Dreame vacuum drill-in page (HTML), responses: { '200': { description: HTML } } }
  /nodes:
    get: { tags: [nodes], summary: Node roster with live ping status, responses: { '200': { description: Nodes } } }
  /connections:
    get: { tags: [nodes], summary: Topology connection vectors, responses: { '200': { description: Connections } } }
  /whoami:
    get: { tags: [chat], summary: Caller's resolved node identity (by source IP), responses: { '200': { description: Identity } } }
  /messages:
    get:
      tags: [chat]
      summary: Chat messages since a cursor
      parameters: [{ name: since, in: query, schema: { type: integer } }]
      responses: { '200': { description: Messages } }
    post:
      tags: [chat]
      summary: Post a chat message
      responses: { '200': { description: Stored }, '400': { description: invalid json } }
  /deploy/{node}/stream:
    get:
      tags: [deploy]
      summary: SSE stream of a node's deploy progress (##STEP events)
      parameters: [{ name: node, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: text/event-stream } }
  /mappings:
    get: { tags: [mappings], summary: All event-source -> targets mappings, responses: { '200': { description: Overview } } }
  /mappings/{source}:
    get:
      tags: [mappings]
      summary: Targets configured for a source
      parameters: [{ name: source, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Targets } }
  /mappings/{source}/{target}:
    get:
      tags: [mappings]
      summary: One source -> target mapping
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: target, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Mapping }, '404': { description: no mapping } }
  /control/config:
    get: { tags: [control], summary: Control hosts and their configured sources / targets, responses: { '200': { description: Config } } }
  /control/signal:
    get: { tags: [control], summary: Current control signal state, responses: { '200': { description: State } } }
    post: { tags: [control], summary: Set the control signal, responses: { '200': { description: OK } } }
  /control/capture:
    get: { tags: [control], summary: Capture session status, responses: { '200': { description: Status } } }
    post: { tags: [control], summary: Start / stop the HDMI capture session, responses: { '200': { description: OK } } }
  /control/capture/grab:
    post: { tags: [control], summary: Grab a single capture frame, responses: { '200': { description: OK } } }
  /control/log:
    get: { tags: [control], summary: Guide-Dog control log tail, responses: { '200': { description: Log } } }
  /control/frame:
    get: { tags: [control], summary: Latest capture frame (image), responses: { '200': { description: Frame } } }
  /control/frame/processed:
    get: { tags: [control], summary: Latest processed (downscaled, contrast-boosted) capture frame (image), responses: { '200': { description: Frame } } }
  /control/frame/kindle:
    get: { tags: [control], summary: E-ink render of the latest capture frame (image), responses: { '200': { description: Frame } } }
  /control/frame/kindle/stream:
    get: { tags: [control], summary: E-ink render as MJPEG (multipart/x-mixed-replace), responses: { '200': { description: Stream } } }
  /control/google/lens:
    get: { tags: [google], summary: Vision (Lens) OCR state, responses: { '200': { description: State } } }
    post: { tags: [google], summary: Trigger a Lens scan, responses: { '200': { description: OK } } }
  /control/google/config:
    get: { tags: [google], summary: Lens config, responses: { '200': { description: Config } } }
  /control/google/latest:
    get: { tags: [google], summary: Latest Lens scan result, responses: { '200': { description: Scan } } }
  /control/google/translate:
    post: { tags: [google], summary: Translate the current Lens scan, responses: { '200': { description: OK } } }
  /control/google/translate-last:
    post: { tags: [google], summary: Translate the last Lens scan, responses: { '200': { description: OK } } }
  /config/open:
    post: { tags: [nodes], summary: Open a config folder on the host (Lab only), responses: { '200': { description: OK } } }
  /workspace/{node}:
    post:
      tags: [nodes]
      summary: Open a node's workspace
      parameters: [{ name: node, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /sd/{node}:
    post:
      tags: [nodes]
      summary: Back up a node's SD/flash card to the cloud (upload only)
      description: >
        Reads the card whose volume label is the node's SD_LABEL, via the Pi hub, and
        uploads matching files to /saves/<console> (and /states/<console>/<node> for
        savestates). Separate from /sync/{node} because it needs the card physically in
        the hub. Nothing is ever written back to the card.
      parameters: [{ name: node, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /catalogue:
    get: { tags: [catalogue], summary: Systems with at least one digital or physical game, responses: { '200': { description: Systems } } }
  /catalogue/sync/stream:
    get:
      tags: [catalogue]
      summary: Sync the local catalogue from the nodes (SSE; read-only against nodes)
      parameters: [{ name: system, in: query, required: false, schema: { type: string, default: '*' } }]
      responses: { '200': { description: text/event-stream of line/done events } }
  /catalogue/missing-covers:
    get: { tags: [catalogue], summary: "Present games with no image linked in the catalogue (no upload, no downloaded art), all systems", responses: { '200': { description: "{games: [{system, key, title}]}" } } }
  /catalogue/physical-only:
    get: { tags: [catalogue], summary: "Games with a physical copy and no digital copy on any node, all systems", responses: { '200': { description: "{games: [{system, key, title}]}" } } }
  /catalogue/{system}:
    get:
      tags: [catalogue]
      summary: One system's games, digital files and physical items merged per game
      parameters: [{ name: system, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Games } }
  /catalogue/{system}/cover/{game}:
    get:
      tags: [catalogue]
      summary: A game's box art (libretro-thumbnails, fetched once and cached)
      parameters:
        - { name: system, in: path, required: true, schema: { type: string } }
        - { name: game, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: image (uploaded art first, else libretro) }, '404': { description: No cover found } }
    post:
      tags: [catalogue]
      summary: Upload a game's own cover (raw PNG/JPEG/WebP body, or JSON {url} to download a pasted link; max 10 MB); wins over libretro art
      parameters:
        - { name: system, in: path, required: true, schema: { type: string } }
        - { name: game, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK }, '413': { description: Too large }, '415': { description: Not an image } }
  /catalogue/{system}/play:
    post:
      tags: [catalogue]
      summary: Launch a ROM (body {path, node}) -- node lab = desktop emulator on the API host (macOS); node batocera = remote boot via EmulationStation
      parameters: [{ name: system, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Launched }, '400': { description: No emulator associated, or not a lab ROM }, '502': { description: The emulator failed to open } }
  /catalogue/{system}/send:
    post:
      tags: [catalogue]
      summary: Send a lab ROM to a node's drive (body {path, node}, or {all true, node} = every lab game the node doesn't have). Only nodes with PS2_HDD_BYTES; the API can't write the drive (root only), so it returns the Terminal command that does
      parameters: [{ name: system, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: "{command}" }, '400': { description: Node can't take games, or not a lab ROM } }
  /catalogue/{system}/scan/{node}:
    post:
      tags: [catalogue]
      summary: A node's complete game list read outside the API (body {files [{path, size}]}), merged like a sync scan (the PS2 HDD command posts here)
      parameters: [{ name: system, in: path, required: true, schema: { type: string } }, { name: node, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: "{ok, lines}" }, '400': { description: Bad body, or the node doesn't host the system }, '409': { description: A sync is running } }
  /catalogue/{system}/forget:
    post:
      tags: [catalogue]
      summary: Remove a copy marked deleted from the catalogue (body {game, node, path}); a game left without copies goes too
      parameters: [{ name: system, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '400': { description: No such copy, or it isn't deleted }, '409': { description: A sync is running } }
  /catalogue/{system}/open:
    post:
      tags: [catalogue]
      summary: Open a lab ROM's folder on the API host (body {path}; lab node only, no SMB)
      parameters: [{ name: system, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '400': { description: No ROMS_PATH or bad path } }
  /catalogue/{system}/favourite-system:
    post:
      tags: [catalogue]
      summary: Star or un-star a whole system on the Media grid (body {on})
      parameters: [{ name: system, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /catalogue/{system}/favourite:
    post:
      tags: [catalogue]
      summary: Star or un-star a game (body {game, on})
      parameters: [{ name: system, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /catalogue/{system}/label:
    post:
      tags: [catalogue]
      summary: Set or clear ("") a game's label, its Pluto name and art lookup (body {game, label})
      parameters: [{ name: system, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /native/{node}/{action}:
    post:
      tags: [nodes]
      summary: Run a native client action on a node (flash / games)
      parameters:
        - { name: node, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK } }
  /dreame/login:
    post: { tags: [nodes], summary: Dreame cloud login, responses: { '200': { description: OK } } }
  /dreame/logout:
    post: { tags: [nodes], summary: Dreame cloud logout, responses: { '200': { description: OK } } }
  /translate/projects:
    get: { tags: [translate], summary: Saved translation projects, responses: { '200': { description: Projects } } }
  /translate/systems:
    get: { tags: [translate], summary: Translatable console systems, responses: { '200': { description: Systems } } }
  /translate/games:
    get:
      tags: [translate]
      summary: Translatable games for a system
      parameters: [{ name: system, in: query, schema: { type: string } }]
      responses: { '200': { description: Games } }
  /translate/extract:
    get:
      tags: [translate]
      summary: Extract a game's dialogue table (STORY.PAC)
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: Blocks }, '502': { description: extract failed } }
  /translate/sources:
    get:
      tags: [translate]
      summary: Discover translatable text files on a disc
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: Sources } }
  /translate/meta:
    get:
      tags: [translate]
      summary: Disc IP.BIN metadata (title, region, product #, version, date) -- instant
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: Metadata } }
  /translate/run:
    post: { tags: [translate], summary: Run the translate -> rebuild build on the box, responses: { '200': { description: OK } } }
  /translate/open:
    post: { tags: [translate], summary: Open a project's dist dir, responses: { '200': { description: OK } } }
  /translate/delete:
    post: { tags: [translate], summary: Delete a saved project, responses: { '200': { description: OK } } }
  /translate/upload:
    post: { tags: [translate], summary: Upload a ROM for a project, responses: { '200': { description: OK } } }
  /translate/{game}/textures:
    get:
      tags: [translate]
      summary: Tar of a project's committed translated textures (PVR/PVM), fetched + spliced at build time
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: tar archive } }
  /translate/{game}:
    get:
      tags: [translate]
      summary: A project's saved state (state.json)
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: State } }
    post:
      tags: [translate]
      summary: Persist a project's state
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Saved } }
    put:
      tags: [translate]
      summary: Persist a project's state (PUT alias)
      parameters: [{ name: game, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Saved } }
  /docs:
    get: { tags: [docs], summary: Swagger UI over the CPC API specs, responses: { '200': { description: HTML } } }
  /docs/{spec}.yaml:
    get:
      tags: [docs]
      summary: One OpenAPI spec (served same-origin)
      parameters: [{ name: spec, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: YAML }, '404': { description: no such spec } }
